name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: kKtPvXY1828oWX73J5qQcbvnLcXWmp1GuF99ts9FWsiQO939hL72DjA60rURfPj0Uzjq6L92oTMUr6TKXaTGe3Vv6zbFlICQmingNqvTSUjpJc63X1cmVaDHOUuPdHqH
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Tesseract (for the OCR test)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env files (compose requires them to exist)
        run: |
          touch .env
          echo "POSTGRES_PASSWORD=ci" >> .env

      - name: Build backend and frontend images
        run: docker compose build backend frontend